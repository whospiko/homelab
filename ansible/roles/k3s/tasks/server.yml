---
# =========================================================
# SERVER PREPARATION
# =========================================================

- name: Create K3s configuration directory
  ansible.builtin.file:
    path: "{{ k3s_config_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"


- name: Download K3s installer
  ansible.builtin.get_url:
    url: "{{ k3s_install_url }}"
    dest: "{{ k3s_install_script }}"
    owner: root
    group: root
    mode: "0755"


# =========================================================
# CHECK INSTALLED K3S VERSION
# =========================================================

- name: Check installed K3s version
  ansible.builtin.command:
    argv:
      - "{{ k3s_binary }}"
      - --version
  register: k3s_server_installed_version
  changed_when: false
  failed_when: false


- name: Check K3s server service
  ansible.builtin.stat:
    path: /etc/systemd/system/k3s.service
  register: k3s_server_service


- name: Determine whether K3s server installation is required
  ansible.builtin.set_fact:
    k3s_server_install_required: >-
      {{
        k3s_server_installed_version.rc != 0
        or
        k3s_version not in k3s_server_installed_version.stdout
        or
        not k3s_server_service.stat.exists
      }}


# =========================================================
# PRIMARY SERVER CONFIGURATION
# =========================================================

- name: Configure primary K3s server
  ansible.builtin.copy:
    dest: "{{ k3s_config_file }}"
    owner: root
    group: root
    mode: "0600"
    content: |
      cluster-init: true

      node-name: "{{ inventory_hostname }}"
      node-ip: "{{ ansible_host | default(ansible_default_ipv4.address) }}"

      cluster-cidr: "{{ k3s_cluster_cidr }}"
      service-cidr: "{{ k3s_service_cidr }}"

      flannel-backend: "{{ k3s_flannel_backend }}"

      prefer-bundled-bin: {{ k3s_prefer_bundled_bin | ternary('true', 'false') }}

      write-kubeconfig-mode: "0600"

      tls-san:
      {% for san in k3s_tls_sans %}
        - "{{ san }}"
      {% endfor %}
  register: k3s_primary_config
  when:
    - inventory_hostname == k3s_primary_server


# =========================================================
# INSTALL PRIMARY SERVER
# =========================================================

- name: Install primary K3s server
  ansible.builtin.command:
    cmd: "{{ k3s_install_script }}"
  environment:
    INSTALL_K3S_VERSION: "{{ k3s_version }}"
    INSTALL_K3S_EXEC: "server"
  register: k3s_primary_install
  when:
    - inventory_hostname == k3s_primary_server
    - k3s_server_install_required | bool


- name: Restart primary K3s server when configuration changes
  ansible.builtin.systemd_service:
    name: k3s
    state: restarted
    enabled: true
    daemon_reload: true
  when:
    - inventory_hostname == k3s_primary_server
    - k3s_primary_config.changed
    - not k3s_server_install_required | bool


- name: Ensure primary K3s server is running
  ansible.builtin.systemd_service:
    name: k3s
    state: started
    enabled: true
  when:
    - inventory_hostname == k3s_primary_server


# =========================================================
# WAIT FOR PRIMARY SERVER
# =========================================================

- name: Wait for primary K3s API
  ansible.builtin.wait_for:
    host: "{{ k3s_registration_address }}"
    port: "{{ k3s_api_port }}"
    timeout: 180
  when:
    - inventory_hostname == k3s_primary_server


- name: Wait for primary K3s token
  ansible.builtin.wait_for:
    path: /var/lib/rancher/k3s/server/token
    timeout: 180
  when:
    - inventory_hostname == k3s_primary_server


# =========================================================
# ADDITIONAL CONTROL-PLANE SERVER
# =========================================================

- name: Wait for primary API before joining additional server
  ansible.builtin.wait_for:
    host: "{{ k3s_registration_address }}"
    port: "{{ k3s_api_port }}"
    timeout: 180
  when:
    - inventory_hostname != k3s_primary_server


- name: Read K3s server token from primary
  ansible.builtin.slurp:
    src: /var/lib/rancher/k3s/server/token
  register: k3s_server_token_raw
  delegate_to: "{{ k3s_primary_server }}"
  no_log: true
  when:
    - inventory_hostname != k3s_primary_server


- name: Store K3s server join token
  ansible.builtin.copy:
    dest: "{{ k3s_join_token_file }}"
    content: "{{ k3s_server_token_raw.content | b64decode | trim }}\n"
    owner: root
    group: root
    mode: "0600"
  no_log: true
  when:
    - inventory_hostname != k3s_primary_server


- name: Configure additional K3s server
  ansible.builtin.copy:
    dest: "{{ k3s_config_file }}"
    owner: root
    group: root
    mode: "0600"
    content: |
      server: "https://{{ k3s_registration_address }}:{{ k3s_api_port }}"
      token-file: "{{ k3s_join_token_file }}"

      node-name: "{{ inventory_hostname }}"
      node-ip: "{{ ansible_host | default(ansible_default_ipv4.address) }}"

      cluster-cidr: "{{ k3s_cluster_cidr }}"
      service-cidr: "{{ k3s_service_cidr }}"

      flannel-backend: "{{ k3s_flannel_backend }}"

      prefer-bundled-bin: {{ k3s_prefer_bundled_bin | ternary('true', 'false') }}

      write-kubeconfig-mode: "0600"

      tls-san:
      {% for san in k3s_tls_sans %}
        - "{{ san }}"
      {% endfor %}
  register: k3s_additional_server_config
  no_log: true
  when:
    - inventory_hostname != k3s_primary_server


- name: Install additional K3s server
  ansible.builtin.command:
    cmd: "{{ k3s_install_script }}"
  environment:
    INSTALL_K3S_VERSION: "{{ k3s_version }}"
    INSTALL_K3S_EXEC: "server"
  register: k3s_additional_server_install
  when:
    - inventory_hostname != k3s_primary_server
    - k3s_server_install_required | bool


- name: Restart additional K3s server when configuration changes
  ansible.builtin.systemd_service:
    name: k3s
    state: restarted
    enabled: true
    daemon_reload: true
  when:
    - inventory_hostname != k3s_primary_server
    - k3s_additional_server_config.changed
    - not k3s_server_install_required | bool


- name: Ensure additional K3s server is running
  ansible.builtin.systemd_service:
    name: k3s
    state: started
    enabled: true
  when:
    - inventory_hostname != k3s_primary_server


# =========================================================
# KUBECONFIG
# =========================================================

- name: Wait for K3s kubeconfig
  ansible.builtin.wait_for:
    path: "{{ k3s_kubeconfig }}"
    timeout: 180


# =========================================================
# ROCKY USER KUBECONFIG
# =========================================================

- name: Create admin user kube directory
  ansible.builtin.file:
    path: "/home/{{ k3s_admin_user }}/.kube"
    state: directory
    owner: "{{ k3s_admin_user }}"
    group: "{{ k3s_admin_group }}"
    mode: "0700"


- name: Copy kubeconfig to admin user
  ansible.builtin.copy:
    src: "{{ k3s_kubeconfig }}"
    dest: "/home/{{ k3s_admin_user }}/.kube/config"
    remote_src: true
    owner: "{{ k3s_admin_user }}"
    group: "{{ k3s_admin_group }}"
    mode: "0600"


# =========================================================
# ROOT KUBECONFIG
# =========================================================

- name: Create root kube directory
  ansible.builtin.file:
    path: /root/.kube
    state: directory
    owner: root
    group: root
    mode: "0700"


- name: Copy kubeconfig to root
  ansible.builtin.copy:
    src: "{{ k3s_kubeconfig }}"
    dest: /root/.kube/config
    remote_src: true
    owner: root
    group: root
    mode: "0600"