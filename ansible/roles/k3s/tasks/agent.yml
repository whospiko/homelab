---
- name: Create K3s configuration directory
  ansible.builtin.file:
    path: "{{ k3s_config_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"


- name: Download K3s install script
  ansible.builtin.get_url:
    url: "{{ k3s_install_url }}"
    dest: "{{ k3s_install_script }}"
    owner: root
    group: root
    mode: "0755"


- name: Wait for K3s API
  ansible.builtin.wait_for:
    host: "{{ k3s_registration_address }}"
    port: "{{ k3s_api_port }}"
    timeout: 180


- name: Read K3s token from primary server
  ansible.builtin.slurp:
    src: /var/lib/rancher/k3s/server/token
  register: k3s_agent_token_raw
  delegate_to: "{{ k3s_primary_server }}"
  no_log: true


- name: Store K3s join token
  ansible.builtin.copy:
    dest: "{{ k3s_join_token_file }}"
    content: "{{ k3s_agent_token_raw.content | b64decode | trim }}\n"
    owner: root
    group: root
    mode: "0600"
  no_log: true


- name: Configure K3s agent
  ansible.builtin.copy:
    dest: "{{ k3s_config_file }}"
    owner: root
    group: root
    mode: "0600"
    content: |
      server: "https://{{ k3s_registration_address }}:{{ k3s_api_port }}"
      token-file: "{{ k3s_join_token_file }}"

      node-name: "{{ inventory_hostname }}"
      node-ip: "{{ ansible_host }}"
  register: k3s_agent_config
  no_log: true


- name: Install K3s agent
  ansible.builtin.command:
    cmd: "{{ k3s_install_script }}"
    creates: /etc/systemd/system/k3s-agent.service
  environment:
    INSTALL_K3S_CHANNEL: "{{ k3s_channel }}"
    INSTALL_K3S_EXEC: "agent"
  register: k3s_agent_install


- name: Restart K3s agent when configuration changes
  ansible.builtin.systemd_service:
    name: k3s-agent
    state: restarted
    enabled: true
    daemon_reload: true
  when:
    - k3s_agent_config.changed
    - not k3s_agent_install.changed


- name: Ensure K3s agent is running
  ansible.builtin.systemd_service:
    name: k3s-agent
    state: started
    enabled: true